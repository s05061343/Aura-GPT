<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUNYX — Obsidian Cyan</title>
  <style>
    :root{
      --bg:#090B10;
      --surface:#171C26;
      --surface-2:#11151D;
      --surface-3:#1D2430;
      --text:#F1F4F8;
      --muted:#9AA4B2;
      --line:#252C38;
      --accent:#5ED7E7;
      --accent-2:#9274FF;
      --accent-soft:#102B31;
      --success:#52D39A;
      --danger:#F1778A;
      --shadow:0 22px 60px rgba(0,0,0,.34);
      --sidebar:278px;
      --sidebar-collapsed:76px;
      --radius:18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(94,215,231,.08), transparent 30%),
        radial-gradient(circle at 100% 0%, rgba(146,116,255,.08), transparent 24%),
        linear-gradient(180deg,#090B10 0%,#0A0D13 100%);
      color:var(--text);
      overflow:hidden;
    }

    button,input,textarea{font:inherit}

    .app{
      height:100%;
      display:grid;
      grid-template-columns:var(--sidebar) 1fr;
      transition:grid-template-columns .24s ease;
    }

    .app.collapsed{grid-template-columns:var(--sidebar-collapsed) 1fr}

    .sidebar{
      height:100vh;
      border-right:1px solid var(--line);
      background:rgba(14,17,24,.94);
      backdrop-filter:blur(18px);
      display:flex;
      flex-direction:column;
      min-width:0;
      overflow:hidden;
    }

    .sidebar-top{
      display:flex;
      align-items:center;
      gap:12px;
      padding:18px 16px 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
      flex:1;
    }

    .brand-icon{
      width:38px;
      height:38px;
      border-radius:13px;
      display:grid;
      place-items:center;
      color:white;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      box-shadow:0 10px 28px rgba(94,215,231,.18);
      flex:0 0 auto;
      font-size:19px;
    }

    .brand-copy{min-width:0}
    .brand-title{font-weight:760;font-size:15px;letter-spacing:.1px}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:2px}

    .icon-btn{
      border:0;
      background:transparent;
      color:#8A94A3;
      width:36px;
      height:36px;
      border-radius:11px;
      display:grid;
      place-items:center;
      cursor:pointer;
    }
    .icon-btn:hover{background:var(--surface-3);color:var(--text)}

    .sidebar-actions{
      padding:8px 12px 12px;
      display:grid;
      gap:8px;
    }

    .new-chat{
      height:44px;
      border:1px solid #28424A;
      background:linear-gradient(180deg,#121A21,#10171D);
      color:#C7F6FA;
      border-radius:14px;
      padding:0 14px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 10px 28px rgba(0,0,0,.18);
    }
    .new-chat:hover{border-color:#3F6974;background:#142028}

    .search{
      height:40px;
      border:0;
      background:transparent;
      border-radius:12px;
      padding:0 12px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#9AA4B2;
      cursor:pointer;
    }
    .search:hover{background:var(--surface-3)}

    .history{
      flex:1;
      overflow:auto;
      padding:4px 10px 12px;
      scrollbar-width:thin;
    }
    .section-label{
      padding:12px 10px 7px;
      color:#697483;
      font-size:11px;
      font-weight:750;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .history-item{
      width:100%;
      border:0;
      background:transparent;
      border-radius:12px;
      padding:10px 10px;
      display:flex;
      gap:10px;
      align-items:center;
      text-align:left;
      cursor:pointer;
      color:#C9D0DA;
      position:relative;
    }
    .history-item:hover{background:#161C25}
    .history-item.active{
      background:#14242A;
      color:#D7FBFE;
      box-shadow:inset 2px 0 0 var(--accent);
    }
    .history-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#596474;
      flex:0 0 auto;
    }
    .active .history-dot{background:var(--accent)}
    .history-text{
      flex:1;
      min-width:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:13px;
      font-weight:590;
    }
    .history-more{
      opacity:0;
      border:0;
      background:transparent;
      color:#6F7A89;
      cursor:pointer;
      width:26px;
      height:26px;
      border-radius:8px;
    }
    .history-item:hover .history-more{opacity:1}
    .history-more:hover{background:#222A36}

    .account-wrap{
      border-top:1px solid var(--line);
      padding:12px;
      position:relative;
    }

    .account{
      width:100%;
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      gap:11px;
      border-radius:14px;
      padding:10px;
      cursor:pointer;
      text-align:left;
    }
    .account:hover{background:#161C25}
    .avatar{
      width:36px;height:36px;border-radius:12px;
      background:linear-gradient(145deg,#1C2632,#354254);
      color:white;
      display:grid;
      place-items:center;
      font-size:12px;
      font-weight:800;
      flex:0 0 auto;
    }
    .account-copy{min-width:0;flex:1}
    .account-name{font-size:13px;font-weight:750}
    .account-status{font-size:11px;color:var(--muted);margin-top:2px}

    .account-menu{
      position:absolute;
      left:12px;
      right:12px;
      bottom:76px;
      background:rgba(23,28,38,.98);
      border:1px solid var(--line);
      border-radius:16px;
      padding:8px;
      box-shadow:var(--shadow);
      display:none;
      z-index:30;
    }
    .account-menu.open{display:block}
    .menu-item{
      width:100%;
      border:0;
      background:transparent;
      display:flex;
      align-items:center;
      gap:9px;
      padding:10px 11px;
      border-radius:10px;
      cursor:pointer;
      color:#D1D7E0;
      text-align:left;
      font-size:13px;
    }
    .menu-item:hover{background:#202733}

    .main{
      min-width:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .topbar{
      height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 28px;
      border-bottom:1px solid rgba(37,44,56,.9);
      background:rgba(9,11,16,.78);
      backdrop-filter:blur(16px);
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .chat-title{font-size:15px;font-weight:750}
    .model-chip{
      display:inline-flex;align-items:center;gap:7px;
      padding:6px 10px;
      border-radius:999px;
      background:#151B24;
      color:#A9B3C1;
      border:1px solid #252C38;
      font-size:11px;
      font-weight:650;
    }
    .status-dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--success);
      box-shadow:0 0 0 4px rgba(82,211,154,.10);
    }

    .topbar-actions{display:flex;gap:6px}

    .workspace{
      flex:1;
      min-height:0;
      display:flex;
      justify-content:center;
      overflow:auto;
      padding:18px 26px 160px;
    }

    .conversation{
      width:min(880px,100%);
      display:flex;
      flex-direction:column;
      gap:26px;
      padding-top:18px;
    }

    .empty-state{
      min-height:calc(100vh - 250px);
      display:grid;
      place-items:center;
    }
    .empty-inner{
      width:min(720px,100%);
      text-align:center;
      margin-top:-44px;
    }

    .orb{
      width:54px;height:54px;border-radius:18px;
      margin:0 auto 18px;
      display:grid;place-items:center;
      color:white;font-size:24px;
      background:linear-gradient(145deg,#5ED7E7,#9274FF);
      box-shadow:0 18px 42px rgba(94,215,231,.16), 0 8px 26px rgba(146,116,255,.14);
    }

    h1{
      margin:0;
      font-size:30px;
      line-height:1.15;
      letter-spacing:-.03em;
    }
    .empty-sub{
      margin:10px auto 24px;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      max-width:560px;
    }

    .starter-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      width:min(620px,100%);
      margin:auto;
    }
    .starter{
      border:1px solid var(--line);
      background:rgba(17,21,29,.82);
      border-radius:16px;
      padding:15px 16px;
      cursor:pointer;
      text-align:left;
      transition:.18s ease;
      box-shadow:0 10px 30px rgba(0,0,0,.16);
    }
    .starter:hover{
      transform:translateY(-1px);
      border-color:#345863;
      background:#151B24;
      box-shadow:0 14px 36px rgba(0,0,0,.24);
    }
    .starter-title{font-size:13px;font-weight:720}
    .starter-sub{font-size:11px;color:var(--muted);margin-top:4px}

    .message{display:flex;gap:12px;align-items:flex-start}
    .message.user{justify-content:flex-end}
    .assistant-mark{
      width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
      background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:900;
      flex:0 0 auto;
    }
    .assistant-body{max-width:760px;line-height:1.75;font-size:14px;color:#D8DEE7}
    .assistant-meta{
      margin-top:10px;color:#959baa;font-size:11px;
      display:flex;gap:8px;align-items:center;
    }
    .user-bubble{
      max-width:72%;
      background:#202631;
      color:white;
      padding:11px 14px;
      border-radius:16px 16px 5px 16px;
      font-size:14px;
      line-height:1.6;
      box-shadow:0 10px 24px rgba(0,0,0,.20);
    }

    .tool-card{
      margin-top:14px;
      border:1px solid var(--line);
      background:#121820;
      border-radius:16px;
      padding:15px;
      box-shadow:0 8px 22px rgba(30,33,45,.04);
    }
    .tool-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .tool-kicker{font-size:11px;color:var(--muted);font-weight:650}
    .tool-value{font-size:25px;font-weight:800;margin-top:2px}
    .tool-positive{font-size:12px;font-weight:750;color:var(--success)}

    .composer-wrap{
      position:absolute;
      left:0;right:0;bottom:0;
      padding:22px 28px 26px;
      background:linear-gradient(180deg,rgba(9,11,16,0),rgba(9,11,16,.90) 36%,rgba(9,11,16,1) 72%);
      pointer-events:none;
    }
    .composer{
      pointer-events:auto;
      width:min(880px,100%);
      margin:auto;
      border:1px solid #2B3340;
      background:rgba(23,28,38,.96);
      border-radius:20px;
      padding:12px 12px 10px 14px;
      box-shadow:0 18px 60px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.015);
      backdrop-filter:blur(18px);
    }

    .composer textarea{
      width:100%;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      min-height:52px;
      max-height:150px;
      padding:4px 4px 8px;
      color:var(--text);
      line-height:1.55;
    }
    .composer textarea::placeholder{color:#667180}

    .composer:focus-within{
      border-color:rgba(94,215,231,.55);
      box-shadow:
        0 18px 60px rgba(0,0,0,.38),
        0 0 0 3px rgba(94,215,231,.07);
    }

    .history::-webkit-scrollbar{width:8px}
    .history::-webkit-scrollbar-track{background:transparent}
    .history::-webkit-scrollbar-thumb{background:#202733;border-radius:999px}
    .history::-webkit-scrollbar-thumb:hover{background:#2A3442}

    .composer-footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .composer-left{display:flex;align-items:center;gap:7px}
    .mini{
      border:0;
      background:#202733;
      color:#AEB7C4;
      height:34px;
      border-radius:11px;
      padding:0 11px;
      cursor:pointer;
      font-size:12px;
      font-weight:650;
    }
    .mini:hover{background:#27313F}

    .send{
      width:36px;height:36px;border-radius:12px;border:0;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      color:white;cursor:pointer;font-size:15px;
      box-shadow:0 8px 18px rgba(124,77,255,.28);
    }
    .send:hover{filter:brightness(.98);transform:translateY(-1px)}

    .collapsed .brand-copy,
    .collapsed .new-chat span,
    .collapsed .search span,
    .collapsed .section-label,
    .collapsed .history-text,
    .collapsed .history-more,
    .collapsed .account-copy,
    .collapsed .account-chevron{
      display:none;
    }

    .collapsed .sidebar-top{justify-content:center;padding-inline:10px}
    .collapsed .brand{flex:0 0 auto}
    .collapsed .collapse-btn{position:absolute;left:74px;top:18px;background:#121820;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.05)}
    .collapsed .sidebar-actions{padding-inline:10px}
    .collapsed .new-chat,.collapsed .search{justify-content:center;padding:0}
    .collapsed .history{padding-inline:10px}
    .collapsed .history-item{justify-content:center;padding:12px 0}
    .collapsed .history-dot{width:9px;height:9px}
    .collapsed .account{justify-content:center;padding-inline:0}
    .collapsed .account-menu{left:76px;right:auto;bottom:18px;width:210px}

    .tooltip{position:relative}
    .collapsed .tooltip:hover::after{
      content:attr(data-tip);
      position:absolute;
      left:54px;
      top:50%;
      transform:translateY(-50%);
      white-space:nowrap;
      background:#242733;
      color:#fff;
      font-size:11px;
      padding:6px 8px;
      border-radius:8px;
      z-index:100;
      pointer-events:none;
      box-shadow:0 8px 22px rgba(0,0,0,.12);
    }

    @media (max-width: 860px){
      .app{grid-template-columns:76px 1fr}
      .brand-copy,.new-chat span,.search span,.section-label,.history-text,.history-more,.account-copy,.account-chevron{display:none}
      .sidebar-top{justify-content:center;padding-inline:10px}
      .brand{flex:0 0 auto}
      .collapse-btn{display:none}
      .new-chat,.search{justify-content:center;padding:0}
      .history-item{justify-content:center}
      .starter-grid{grid-template-columns:1fr}
      .topbar{padding-inline:18px}
      .workspace{padding-inline:16px;padding-bottom:150px}
      .composer-wrap{padding-inline:16px}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-icon">✦</div>
          <div class="brand-copy">
            <div class="brand-title">JUNYX</div>
            <div class="brand-sub">Local AI Agent</div>
          </div>
        </div>
        <button class="icon-btn collapse-btn tooltip" id="collapseBtn" data-tip="收合側邊欄" aria-label="Toggle sidebar">‹</button>
      </div>

      <div class="sidebar-actions">
        <button class="new-chat tooltip" data-tip="新增對話" id="newChatBtn">
          <b>＋</b><span>New chat</span>
        </button>
        <button class="search tooltip" data-tip="搜尋紀錄" id="searchBtn">
          <span>⌕</span><span>Search conversations</span>
        </button>
      </div>

      <div class="history" id="history">
        <div class="section-label">Pinned</div>
        <button class="history-item active tooltip" data-tip="JUNYX UI redesign">
          <span class="history-dot"></span>
          <span class="history-text">JUNYX UI redesign</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>

        <div class="section-label">Today</div>
        <button class="history-item tooltip" data-tip="台積電今天收盤價">
          <span class="history-dot"></span>
          <span class="history-text">台積電今天收盤價</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>
        <button class="history-item tooltip" data-tip="面試英文自我介紹">
          <span class="history-dot"></span>
          <span class="history-text">面試英文自我介紹</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>
        <button class="history-item tooltip" data-tip="LangChain Agent 設計">
          <span class="history-dot"></span>
          <span class="history-text">LangChain Agent 設計</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>

        <div class="section-label">Yesterday</div>
        <button class="history-item tooltip" data-tip="Qwen tool calling test">
          <span class="history-dot"></span>
          <span class="history-text">Qwen tool calling test</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>
        <button class="history-item tooltip" data-tip="Generative UI cards">
          <span class="history-dot"></span>
          <span class="history-text">Generative UI cards</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>

        <div class="section-label">Earlier</div>
        <button class="history-item tooltip" data-tip="LangSmith tracing">
          <span class="history-dot"></span>
          <span class="history-text">LangSmith tracing</span>
          <button class="history-more" tabindex="-1">•••</button>
        </button>
      </div>

      <div class="account-wrap">
        <div class="account-menu" id="accountMenu">
          <button class="menu-item">◉ Profile</button>
          <button class="menu-item">⚙ Settings</button>
          <button class="menu-item">◐ Appearance</button>
          <button class="menu-item">⌘ Model settings</button>
          <button class="menu-item">↗ LangSmith</button>
          <button class="menu-item">⇥ Sign out</button>
        </div>

        <button class="account tooltip" id="accountBtn" data-tip="使用者帳號">
          <div class="avatar">JL</div>
          <div class="account-copy">
            <div class="account-name">Junlin Liu</div>
            <div class="account-status">Local mode active</div>
          </div>
          <span class="account-chevron">⌄</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <div class="chat-title">New conversation</div>
          </div>
          <div class="model-chip">
            <span class="status-dot"></span>
            Qwen3 8B · Local
          </div>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" title="LangSmith">↗</button>
          <button class="icon-btn" title="More">•••</button>
        </div>
      </header>

      <section class="workspace" id="workspace">
        <div class="conversation" id="conversation">
          <div class="empty-state" id="emptyState">
            <div class="empty-inner">
              <div class="orb">✦</div>
              <h1>What can JUNYX help with?</h1>
              <div class="empty-sub">
                Obsidian Cyan 深色主題：以冷黑、青藍與少量 JUNYX Violet 建立更成熟的 Local AI Workspace。
              </div>

              <div class="starter-grid">
                <button class="starter" data-prompt="幫我查台北今天的天氣">
                  <div class="starter-title">☀ 查詢台北天氣</div>
                  <div class="starter-sub">用工具取得即時天氣與簡短建議</div>
                </button>
                <button class="starter" data-prompt="幫我查台積電今天的收盤價">
                  <div class="starter-title">📈 台積電收盤價</div>
                  <div class="starter-sub">展示 Generative UI 資料卡片</div>
                </button>
                <button class="starter" data-prompt="使用 Agent 幫我整理今天待辦">
                  <div class="starter-title">✦ 使用 Agent 完成任務</div>
                  <div class="starter-sub">呈現 tool call、approval 與執行狀態</div>
                </button>
                <button class="starter" data-prompt="介紹一下你目前使用的本機模型">
                  <div class="starter-title">⌘ 試試本機 Qwen</div>
                  <div class="starter-sub">凸顯 Local AI 與模型切換能力</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="prompt" placeholder="Ask JUNYX anything..."></textarea>
          <div class="composer-footer">
            <div class="composer-left">
              <button class="mini">＋</button>
              <button class="mini">Tools</button>
              <button class="mini">Qwen3 8B⌄</button>
            </div>
            <button class="send" id="sendBtn">↑</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');
    const collapseBtn = document.getElementById('collapseBtn');
    const accountBtn = document.getElementById('accountBtn');
    const accountMenu = document.getElementById('accountMenu');
    const sendBtn = document.getElementById('sendBtn');
    const prompt = document.getElementById('prompt');
    const conversation = document.getElementById('conversation');
    const emptyState = document.getElementById('emptyState');

    collapseBtn.addEventListener('click', () => {
      app.classList.toggle('collapsed');
      collapseBtn.textContent = app.classList.contains('collapsed') ? '›' : '‹';
      collapseBtn.dataset.tip = app.classList.contains('collapsed') ? '展開側邊欄' : '收合側邊欄';
    });

    accountBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      accountMenu.classList.toggle('open');
    });

    document.addEventListener('click', () => accountMenu.classList.remove('open'));

    document.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });

    document.querySelectorAll('.starter').forEach(btn => {
      btn.addEventListener('click', () => {
        prompt.value = btn.dataset.prompt;
        prompt.focus();
      });
    });

    function addMessage(text){
      if (!text.trim()) return;
      if (emptyState) emptyState.remove();

      const user = document.createElement('div');
      user.className = 'message user';
      user.innerHTML = `<div class="user-bubble"></div>`;
      user.querySelector('.user-bubble').textContent = text;
      conversation.appendChild(user);

      const assistant = document.createElement('div');
      assistant.className = 'message';
      assistant.innerHTML = `
        <div class="assistant-mark">✦</div>
        <div class="assistant-body">
          我會把回答直接放在工作區，而不是再包一層白色聊天框。這裡也能自然插入 Agent 狀態、工具結果與 Generative UI。
          <div class="tool-card">
            <div class="tool-row">
              <div>
                <div class="tool-kicker">2330 · TSMC</div>
                <div class="tool-value">NT$ 1,245</div>
              </div>
              <div class="tool-positive">+1.63%</div>
            </div>
          </div>
          <div class="assistant-meta">✓ Used TWSE · 620ms</div>
        </div>
      `;
      conversation.appendChild(assistant);

      prompt.value = '';
      document.getElementById('workspace').scrollTo({
        top: document.getElementById('workspace').scrollHeight,
        behavior: 'smooth'
      });
    }

    sendBtn.addEventListener('click', () => addMessage(prompt.value));

    prompt.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        addMessage(prompt.value);
      }
    });

    document.getElementById('newChatBtn').addEventListener('click', () => {
      conversation.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div class="empty-inner">
            <div class="orb">✦</div>
            <h1>What can JUNYX help with?</h1>
            <div class="empty-sub">New conversation ready.</div>
          </div>
        </div>`;
      prompt.value = '';
      prompt.focus();
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const q = window.prompt('搜尋對話名稱');
      if (!q) return;
      document.querySelectorAll('.history-item').forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(q.toLowerCase()) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
